# TITAN local development stack.
#
# Profiles (combine with repeated --profile flags or COMPOSE_PROFILES):
#   core           web, gateway, government + operations services   (~3 GB RAM)
#   iot            MQTT broker, device/telemetry/alert services, simulator
#   analytics      data pipeline + analytics service
#   ai             AI gateway (works without a model; Ollama is optional)
#   observability  Prometheus, Grafana, Loki
#   dr-lab         standby database + backup tooling for recovery drills
#
# PostgreSQL, NATS and Keycloak have no profile and start with any of them.
# This is a single-host development topology. It is NOT highly available.
name: titan

x-node-build: &node-build
  context: .
  dockerfile: infrastructure/docker/node-service.Dockerfile

x-node-service: &node-service
  restart: unless-stopped
  networks: [titan]
  depends_on:
    postgres:
      condition: service_healthy
  mem_limit: 384m
  security_opt: ["no-new-privileges:true"]
  read_only: true
  tmpfs: [/tmp]

x-node-env: &node-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  NATS_URL: nats://nats:4222
  OIDC_ISSUER: ${KEYCLOAK_PUBLIC_URL}/realms/titan
  OIDC_JWKS_URI: http://keycloak:8080/realms/titan/protocol/openid-connect/certs
  OIDC_AUDIENCE: titan-api

services:
  # --------------------------------------------------------------- platform
  postgres:
    image: titan/postgres:dev
    build:
      context: infrastructure/docker/postgres
    restart: unless-stopped
    networks: [titan]
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      DB_DEV_PASSWORD: ${DB_DEV_PASSWORD}
      # Normally the primary. The failback procedure temporarily starts this
      # node as a standby of the recovery database (see scripts/dr/failback.mjs).
      PG_ROLE: ${PG_PRIMARY_ROLE:-primary}
      PG_UPSTREAM_HOST: ${PG_PRIMARY_UPSTREAM:-postgres-dr}
      PG_REPLICATION_PASSWORD: ${DB_DEV_PASSWORD}_replicator
      PG_NODE_NAME: primary-site
    command: &postgres-command
      - postgres
      - -c
      - max_connections=300
      - -c
      - wal_keep_size=512MB
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - hot_standby=on
      - -c
      - archive_mode=on
      - -c
      - archive_command=/usr/local/bin/archive-wal.sh %p %f
      - -c
      - log_min_duration_statement=500
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-wal-archive:/wal-archive
    healthcheck:
      # TCP on purpose: the temporary server used during first-time
      # initialisation listens only on the unix socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_SUPERUSER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    mem_limit: 1g

  # One-shot: creates the database and roles of any service added after this
  # installation's data directory was first initialised. Creates only what is
  # missing; never changes or drops anything.
  postgres-ensure:
    image: titan/postgres:dev
    networks: [titan]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/usr/local/bin/titan-ensure-databases.sh"]
    environment:
      PGHOST: ${DB_HOST:-postgres}
      PGUSER: ${POSTGRES_SUPERUSER}
      PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      DB_DEV_PASSWORD: ${DB_DEV_PASSWORD}

  nats:
    image: nats:2.12-alpine
    restart: unless-stopped
    networks: [titan]
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222", "--name", "titan-nats-dev"]
    ports:
      - "127.0.0.1:${NATS_HOST_PORT}:4222"
      - "127.0.0.1:${NATS_MONITOR_HOST_PORT}:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m

  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    restart: unless-stopped
    networks: [titan]
    command: ["start-dev", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${DB_HOST:-postgres}:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${DB_DEV_PASSWORD}_keycloak
      # Tokens always carry the public issuer URL, whichever network path the
      # request arrived on; services fetch keys over the internal network.
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Substituted into the imported realm file.
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD}
      SVC_PIPELINE_CLIENT_SECRET: ${SVC_PIPELINE_CLIENT_SECRET}
      SVC_AI_CLIENT_SECRET: ${SVC_AI_CLIENT_SECRET}
      TITAN_WEB_ORIGIN: ${WEB_ORIGIN}
    ports:
      - "127.0.0.1:${KEYCLOAK_HOST_PORT}:8080"
    volumes:
      - ./infrastructure/docker/keycloak/titan-realm.json:/opt/keycloak/data/import/titan-realm.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 60s
    mem_limit: 1280m

  gateway:
    <<: *node-service
    image: titan/gateway:dev
    build:
      <<: *node-build
      args:
        SERVICE_PATH: apps/gateway
    profiles: [core]
    depends_on: {}
    environment:
      <<: *node-env
      SERVICE_NAME: gateway
      WEB_ORIGIN: ${WEB_ORIGIN}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-600}
      TITAN_ENVIRONMENT: local-development
      # Read-only statistics access for the disaster-recovery dashboard.
      MONITOR_DATABASE_URL: postgres://titan_monitor:${DB_DEV_PASSWORD}_titan_monitor@postgres:5432/postgres
      DR_MONITOR_DATABASE_URL: postgres://titan_monitor:${DB_DEV_PASSWORD}_titan_monitor@postgres-dr:5432/postgres
      DR_ARTIFACTS_DIR: /dr
    volumes:
      - ./infrastructure/disaster-recovery/backups:/dr/backups:ro
      - ./infrastructure/disaster-recovery/reports:/dr/reports:ro
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORT}:3000"

  web:
    image: titan/web:dev
    build:
      context: .
      dockerfile: infrastructure/docker/web/Dockerfile
    restart: unless-stopped
    networks: [titan]
    profiles: [core]
    environment:
      # Public URLs as seen by the browser.
      TITAN_GATEWAY_URL: http://localhost:${GATEWAY_HOST_PORT}
      TITAN_KEYCLOAK_URL: ${KEYCLOAK_PUBLIC_URL}
      TITAN_ENVIRONMENT: local-development
      # The camera page may play HLS from the local video test server.
      TITAN_VIDEO_ORIGIN: http://localhost:${VIDEO_HOST_PORT:-8888}
      # Map background tiles; empty = public OpenStreetMap server, "none" = no external requests.
      TITAN_MAP_TILE_URL: ${MAP_TILE_URL:-}
    ports:
      - "127.0.0.1:${WEB_HOST_PORT}:8080"
    mem_limit: 128m
    security_opt: ["no-new-privileges:true"]

  # ------------------------------------------------- enterprise foundation
  tenant-service:
    <<: *node-service
    image: titan/tenant-service:dev
    build:
      <<: *node-build
      args:
        SERVICE_PATH: services/tenant-service
    profiles: [core]
    environment:
      <<: *node-env
      SERVICE_NAME: tenant-service
      DB_APP_ROLE: tenant_app
      DATABASE_URL: postgres://tenant_app:${DB_DEV_PASSWORD}_tenant_app@${DB_HOST:-postgres}:5432/titan_tenant
      DATABASE_OWNER_URL: postgres://tenant_owner:${DB_DEV_PASSWORD}_tenant_owner@${DB_HOST:-postgres}:5432/titan_tenant

  case-service:
    <<: *node-service
    image: titan/case-service:dev
    build:
      <<: *node-build
      args:
        SERVICE_PATH: services/case-service
    profiles: [core]
    environment:
      <<: *node-env
      SERVICE_NAME: case-service
      DB_APP_ROLE: case_app
      DATABASE_URL: postgres://case_app:${DB_DEV_PASSWORD}_case_app@${DB_HOST:-postgres}:5432/titan_case
      DATABASE_OWNER_URL: postgres://case_owner:${DB_DEV_PASSWORD}_case_owner@${DB_HOST:-postgres}:5432/titan_case

  workflow-service:
    <<: *node-service
    image: titan/workflow-service:dev
    build:
      <<: *node-build
      args:
        SERVICE_PATH: services/workflow-service
    profiles: [core]
    environment:
      <<: *node-env
      SERVICE_NAME: workflow-service
      DB_APP_ROLE: workflow_app
      DATABASE_URL: postgres://workflow_app:${DB_DEV_PASSWORD}_workflow_app@${DB_HOST:-postgres}:5432/titan_workflow
      DATABASE_OWNER_URL: postgres://workflow_owner:${DB_DEV_PASSWORD}_workflow_owner@${DB_HOST:-postgres}:5432/titan_workflow

  notification-service:
    <<: *node-service
    image: titan/notification-service:dev
    build:
      <<: *node-build
      args:
        SERVICE_PATH: services/notification-service
    profiles: [core]
    environment:
      <<: *node-env
      SERVICE_NAME: notification-service
      DB_APP_ROLE: notification_app
      DATABASE_URL: postgres://notification_app:${DB_DEV_PASSWORD}_notification_app@${DB_HOST:-postgres}:5432/titan_notification
      DATABASE_OWNER_URL: postgres://notification_owner:${DB_DEV_PASSWORD}_notification_owner@${DB_HOST:-postgres}:5432/titan_notification
      # "mailpit" delivers by SMTP to the local catcher below (read it at http://localhost:8025);
      # "log" only records the message. No real e-mail leaves this stack: the adapter refuses other hosts.
      EMAIL_ADAPTER: ${EMAIL_ADAPTER:-mailpit}
      MAIL_CATCHER_HOST: mailpit
      MAIL_CATCHER_PORT: "1025"

  # Local mail catcher: accepts every message, delivers none, shows them in a web inbox.
  mailpit:
    image: axllent/mailpit:v1.21.0
    restart: unless-stopped
    networks: [titan]
    profiles: [core]
    ports:
      - "127.0.0.1:${MAILPIT_HOST_PORT:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: "2000"
    mem_limit: 128m
    security_opt: ["no-new-privileges:true"]

  audit-service:
    <<: *node-service
    image: titan/audit-service:dev
    build:
      <<: *node-build
      args:
        SERVICE_PATH: services/audit-service
    profiles: [core]
    environment:
      <<: *node-env
      SERVICE_NAME: audit-service
      DB_APP_ROLE: audit_app
      DATABASE_URL: postgres://audit_app:${DB_DEV_PASSWORD}_audit_app@${DB_HOST:-postgres}:5432/titan_audit
      DATABASE_OWNER_URL: postgres://audit_owner:${DB_DEV_PASSWORD}_audit_owner@${DB_HOST:-postgres}:5432/titan_audit

  # -------------------------------------------------- enterprise operations
  asset-service:
    <<: *node-service
    image: titan/asset-service:dev
    build:
      <<: *node-build
      args:
        SERVICE_PATH: services/asset-service
    profiles: [core]
    environment:
      <<: *node-env
      SERVICE_NAME: asset-service
      DB_APP_ROLE: asset_app
      DATABASE_URL: postgres://asset_app:${DB_DEV_PASSWORD}_asset_app@${DB_HOST:-postgres}:5432/titan_asset
      DATABASE_OWNER_URL: postgres://asset_owner:${DB_DEV_PASSWORD}_asset_owner@${DB_HOST:-postgres}:5432/titan_asset

  incident-service:
    <<: *node-service
    image: titan/incident-service:dev
    build:
      <<: *node-build
      args:
        SERVICE_PATH: services/incident-service
    profiles: [core]
    environment:
      <<: *node-env
      SERVICE_NAME: incident-service
      DB_APP_ROLE: incident_app
      DATABASE_URL: postgres://incident_app:${DB_DEV_PASSWORD}_incident_app@${DB_HOST:-postgres}:5432/titan_incident
      DATABASE_OWNER_URL: postgres://incident_owner:${DB_DEV_PASSWORD}_incident_owner@${DB_HOST:-postgres}:5432/titan_incident

  # Reusable business capability (layer B): activated per tenant by industry packs.
  maintenance-service:
    <<: *node-service
    image: titan/maintenance-service:dev
    build:
      <<: *node-build
      args:
        SERVICE_PATH: services/maintenance-service
    profiles: [core]
    depends_on:
      postgres:
        condition: service_healthy
      postgres-ensure:
        condition: service_completed_successfully
    environment:
      <<: *node-env
      SERVICE_NAME: maintenance-service
      DB_APP_ROLE: maintenance_app
      DATABASE_URL: postgres://maintenance_app:${DB_DEV_PASSWORD}_maintenance_app@${DB_HOST:-postgres}:5432/titan_maintenance
      DATABASE_OWNER_URL: postgres://maintenance_owner:${DB_DEV_PASSWORD}_maintenance_owner@${DB_HOST:-postgres}:5432/titan_maintenance
      # How often preventive and inspection plans are checked (development: 15 s).
      MAINTENANCE_PLAN_SWEEP_MS: ${MAINTENANCE_PLAN_SWEEP_MS:-15000}

  # Universal core (no capability needed): controlled documents and geospatial zones.
  document-service:
    <<: *node-service
    image: titan/document-service:dev
    build:
      <<: *node-build
      args:
        SERVICE_PATH: services/document-service
    profiles: [core]
    depends_on: &ensured-db
      postgres:
        condition: service_healthy
      postgres-ensure:
        condition: service_completed_successfully
    environment:
      <<: *node-env
      SERVICE_NAME: document-service
      DB_APP_ROLE: document_app
      DATABASE_URL: postgres://document_app:${DB_DEV_PASSWORD}_document_app@${DB_HOST:-postgres}:5432/titan_document
      DATABASE_OWNER_URL: postgres://document_owner:${DB_DEV_PASSWORD}_document_owner@${DB_HOST:-postgres}:5432/titan_document
      # Set CLAMAV_HOST=clamav (and start the "scan" profile) to scan every upload with ClamAV.
      # When set, an unreachable scanner refuses uploads (fail closed).
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      CLAMAV_PORT: "3310"

  # Optional antivirus daemon for document uploads (profile "scan"). At start it downloads virus
  # signatures from the ClamAV project (database.clamav.net); no document content leaves the stack.
  clamav:
    image: clamav/clamav:1.4.3
    restart: unless-stopped
    networks: [titan]
    profiles: [scan]
    mem_limit: 1536m
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc -w 2 127.0.0.1 3310 | grep -q PONG"]
      interval: 15s
      timeout: 5s
      retries: 40

  geospatial-service:
    <<: *node-service
    image: titan/geospatial-service:dev
    build:
      <<: *node-build
      args:
        SERVICE_PATH: services/geospatial-service
    profiles: [core]
    depends_on: *ensured-db
    environment:
      <<: *node-env
      SERVICE_NAME: geospatial-service
      DB_APP_ROLE: geo_app
      DATABASE_URL: postgres://geo_app:${DB_DEV_PASSWORD}_geo_app@${DB_HOST:-postgres}:5432/titan_geo
      DATABASE_OWNER_URL: postgres://geo_owner:${DB_DEV_PASSWORD}_geo_owner@${DB_HOST:-postgres}:5432/titan_geo

  # Switchable capabilities (layer B): procurement, reporting, integrations, video.
  procurement-service:
    <<: *node-service
    image: titan/procurement-service:dev
    build:
      <<: *node-build
      args:
        SERVICE_PATH: services/procurement-service
    profiles: [core]
    depends_on: *ensured-db
    environment:
      <<: *node-env
      SERVICE_NAME: procurement-service
      DB_APP_ROLE: procurement_app
      DATABASE_URL: postgres://procurement_app:${DB_DEV_PASSWORD}_procurement_app@${DB_HOST:-postgres}:5432/titan_procurement
      DATABASE_OWNER_URL: postgres://procurement_owner:${DB_DEV_PASSWORD}_procurement_owner@${DB_HOST:-postgres}:5432/titan_procurement

  report-service:
    <<: *node-service
    image: titan/report-service:dev
    build:
      <<: *node-build
      args:
        SERVICE_PATH: services/report-service
    profiles: [core]
    depends_on: *ensured-db
    environment:
      <<: *node-env
      SERVICE_NAME: report-service
      DB_APP_ROLE: report_app
      DATABASE_URL: postgres://report_app:${DB_DEV_PASSWORD}_report_app@${DB_HOST:-postgres}:5432/titan_report
      DATABASE_OWNER_URL: postgres://report_owner:${DB_DEV_PASSWORD}_report_owner@${DB_HOST:-postgres}:5432/titan_report
      # Datasets are read with the requesting user's token (analytics profile).
      ANALYTICS_URL: http://analytics-service:8000

  integration-service:
    <<: *node-service
    image: titan/integration-service:dev
    build:
      <<: *node-build
      args:
        SERVICE_PATH: services/integration-service
    profiles: [core]
    depends_on: *ensured-db
    environment:
      <<: *node-env
      SERVICE_NAME: integration-service
      DB_APP_ROLE: integration_app
      DATABASE_URL: postgres://integration_app:${DB_DEV_PASSWORD}_integration_app@${DB_HOST:-postgres}:5432/titan_integration
      DATABASE_OWNER_URL: postgres://integration_owner:${DB_DEV_PASSWORD}_integration_owner@${DB_HOST:-postgres}:5432/titan_integration
      INTEGRATION_SECRET_KEY: ${INTEGRATION_SECRET_KEY}
      # Outbound webhooks go ONLY to these hosts. The default is the local test receiver below.
      WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-webhook-sink}

  # Local test receiver for outbound webhooks: records what it receives, sends nothing anywhere.
  webhook-sink:
    image: node:22-alpine
    restart: unless-stopped
    networks: [titan]
    profiles: [core]
    command: ["node", "/sink/server.mjs"]
    ports:
      # Loopback only: lets the integration tests read what was received.
      - "127.0.0.1:${WEBHOOK_SINK_HOST_PORT:-8099}:8080"
    volumes:
      - ./infrastructure/docker/webhook-sink:/sink:ro
    read_only: true
    mem_limit: 64m
    security_opt: ["no-new-privileges:true"]

  # Local video test server: synthetic test-pattern streams for the camera module (HLS on 8888).
  video-lab:
    image: bluenviron/mediamtx:1.9.3-ffmpeg
    restart: unless-stopped
    networks: [titan]
    profiles: [core]
    volumes:
      - ./infrastructure/docker/mediamtx/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "127.0.0.1:${VIDEO_HOST_PORT:-8888}:8888"
    mem_limit: 256m
    cpus: 0.5
    security_opt: ["no-new-privileges:true"]

  video-service:
    <<: *node-service
    image: titan/video-service:dev
    build:
      <<: *node-build
      args:
        SERVICE_PATH: services/video-service
    profiles: [core]
    depends_on: *ensured-db
    environment:
      <<: *node-env
      SERVICE_NAME: video-service
      DB_APP_ROLE: video_app
      DATABASE_URL: postgres://video_app:${DB_DEV_PASSWORD}_video_app@${DB_HOST:-postgres}:5432/titan_video
      DATABASE_OWNER_URL: postgres://video_owner:${DB_DEV_PASSWORD}_video_owner@${DB_HOST:-postgres}:5432/titan_video

  # ---------------------------------------------- intelligent infrastructure
  mosquitto:
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    networks: [titan]
    profiles: [iot]
    environment:
      MQTT_SIMULATOR_USER: ${MQTT_SIMULATOR_USER}
      MQTT_SIMULATOR_PASSWORD: ${MQTT_SIMULATOR_PASSWORD}
      MQTT_TELEMETRY_USER: ${MQTT_TELEMETRY_USER}
      MQTT_TELEMETRY_PASSWORD: ${MQTT_TELEMETRY_PASSWORD}
    entrypoint: ["/bin/sh", "/titan/entrypoint.sh"]
    ports:
      - "127.0.0.1:${MQTT_HOST_PORT}:1883"
    volumes:
      - ./infrastructure/docker/mosquitto:/titan:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -u \"$$MQTT_TELEMETRY_USER\" -P \"$$MQTT_TELEMETRY_PASSWORD\" -t '$$SYS/broker/uptime' -C 1 -W 3 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 128m

  device-service:
    <<: *node-service
    image: titan/device-service:dev
    build:
      <<: *node-build
      args:
        SERVICE_PATH: services/device-service
    profiles: [iot]
    environment:
      <<: *node-env
      SERVICE_NAME: device-service
      DB_APP_ROLE: device_app
      DATABASE_URL: postgres://device_app:${DB_DEV_PASSWORD}_device_app@${DB_HOST:-postgres}:5432/titan_device
      DATABASE_OWNER_URL: postgres://device_owner:${DB_DEV_PASSWORD}_device_owner@${DB_HOST:-postgres}:5432/titan_device

  telemetry-service:
    <<: *node-service
    image: titan/telemetry-service:dev
    build:
      <<: *node-build
      args:
        SERVICE_PATH: services/telemetry-service
    profiles: [iot]
    environment:
      <<: *node-env
      SERVICE_NAME: telemetry-service
      DB_APP_ROLE: telemetry_app
      DATABASE_URL: postgres://telemetry_app:${DB_DEV_PASSWORD}_telemetry_app@${DB_HOST:-postgres}:5432/titan_telemetry
      DATABASE_OWNER_URL: postgres://telemetry_owner:${DB_DEV_PASSWORD}_telemetry_owner@${DB_HOST:-postgres}:5432/titan_telemetry
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_USERNAME: ${MQTT_TELEMETRY_USER}
      MQTT_PASSWORD: ${MQTT_TELEMETRY_PASSWORD}

  alert-service:
    <<: *node-service
    image: titan/alert-service:dev
    build:
      <<: *node-build
      args:
        SERVICE_PATH: services/alert-service
    profiles: [iot]
    environment:
      <<: *node-env
      SERVICE_NAME: alert-service
      DB_APP_ROLE: alert_app
      DATABASE_URL: postgres://alert_app:${DB_DEV_PASSWORD}_alert_app@${DB_HOST:-postgres}:5432/titan_alert
      DATABASE_OWNER_URL: postgres://alert_owner:${DB_DEV_PASSWORD}_alert_owner@${DB_HOST:-postgres}:5432/titan_alert

  # ------------------------------------------------------ data and intelligence
  data-pipeline-service:
    image: titan/data-pipeline-service:dev
    build:
      context: .
      dockerfile: infrastructure/docker/python-service.Dockerfile
      target: runtime
      args:
        SERVICE_PATH: services/data-pipeline-service
    restart: unless-stopped
    networks: [titan]
    profiles: [analytics]
    depends_on:
      postgres:
        condition: service_healthy
    environment: &python-env
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NATS_URL: nats://nats:4222
      OIDC_ISSUER: ${KEYCLOAK_PUBLIC_URL}/realms/titan
      OIDC_JWKS_URI: http://keycloak:8080/realms/titan/protocol/openid-connect/certs
      OIDC_TOKEN_URL: http://keycloak:8080/realms/titan/protocol/openid-connect/token
      OIDC_AUDIENCE: titan-api
      SERVICE_NAME: data-pipeline-service
      DB_APP_ROLE: pipeline_app
      DATABASE_URL: postgres://pipeline_app:${DB_DEV_PASSWORD}_pipeline_app@${DB_HOST:-postgres}:5432/titan_pipeline
      DATABASE_OWNER_URL: postgres://pipeline_owner:${DB_DEV_PASSWORD}_pipeline_owner@${DB_HOST:-postgres}:5432/titan_pipeline
      SERVICE_CLIENT_ID: svc-pipeline
      SERVICE_CLIENT_SECRET: ${SVC_PIPELINE_CLIENT_SECRET}
      ANALYTICS_URL: http://analytics-service:8000
      LAKE_DIR: /lake
      PIPELINE_INTERVAL_SECONDS: ${PIPELINE_INTERVAL_SECONDS:-30}
      # Bounded batches keep memory flat however large the backlog is (lab default).
      PIPELINE_MAX_EVENTS_PER_RUN: ${PIPELINE_MAX_EVENTS_PER_RUN:-50000}
      # Development aid: allows POST /runs {"simulate_failure": true}.
      PIPELINE_ALLOW_FAULT_INJECTION: "true"
    volumes:
      - lake:/lake
    # Raised from 768m on 2026-11-18: runs over ~1.9M bronze events exhausted 768 MiB (see the verification report).
    mem_limit: 1536m
    security_opt: ["no-new-privileges:true"]

  analytics-service:
    image: titan/analytics-service:dev
    build:
      context: .
      dockerfile: infrastructure/docker/python-service.Dockerfile
      target: runtime
      args:
        SERVICE_PATH: services/analytics-service
    restart: unless-stopped
    networks: [titan]
    profiles: [analytics]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *python-env
      SERVICE_NAME: analytics-service
      DB_APP_ROLE: analytics_app
      DATABASE_URL: postgres://analytics_app:${DB_DEV_PASSWORD}_analytics_app@${DB_HOST:-postgres}:5432/titan_analytics
      DATABASE_OWNER_URL: postgres://analytics_owner:${DB_DEV_PASSWORD}_analytics_owner@${DB_HOST:-postgres}:5432/titan_analytics
      # Read-only role used exclusively for approved query templates.
      DATABASE_READONLY_URL: postgres://analytics_ro:${DB_DEV_PASSWORD}_analytics_ro@${DB_HOST:-postgres}:5432/titan_analytics
      # Asked, with the caller's own token, which capabilities and query templates the caller's tenant has.
      TENANT_URL: http://tenant-service:3000
      SERVICE_CLIENT_ID: ""
      SERVICE_CLIENT_SECRET: ""
    volumes:
      # The gold layer is this service's input contract; it never writes to the lake.
      - lake:/lake:ro
    mem_limit: 512m
    security_opt: ["no-new-privileges:true"]

  ai-gateway-service:
    # Optional subsystem. Starts and answers (deterministically) with no model
    # installed; set OLLAMA_BASE_URL to a reachable Ollama server to use one.
    image: titan/ai-gateway-service:dev
    build:
      context: .
      dockerfile: infrastructure/docker/python-service.Dockerfile
      target: runtime
      args:
        SERVICE_PATH: services/ai-gateway-service
    restart: unless-stopped
    networks: [titan]
    profiles: [ai]
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *python-env
      SERVICE_NAME: ai-gateway-service
      DB_APP_ROLE: ai_app
      DATABASE_URL: postgres://ai_app:${DB_DEV_PASSWORD}_ai_app@${DB_HOST:-postgres}:5432/titan_ai
      DATABASE_OWNER_URL: postgres://ai_owner:${DB_DEV_PASSWORD}_ai_owner@${DB_HOST:-postgres}:5432/titan_ai
      SERVICE_CLIENT_ID: svc-ai
      SERVICE_CLIENT_SECRET: ${SVC_AI_CLIENT_SECRET}
      AI_ENABLED: ${AI_ENABLED:-true}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2:1b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      AI_RATE_LIMIT_PER_MINUTE: ${AI_RATE_LIMIT_PER_MINUTE:-60}
      # Tools call the owning services directly, always with the end user's token.
      ANALYTICS_URL: http://analytics-service:8000
      INCIDENT_URL: http://incident-service:3000
      TELEMETRY_URL: http://telemetry-service:3000
      WORKFLOW_URL: http://workflow-service:3000
      MAINTENANCE_URL: http://maintenance-service:3000
      # Which tools the caller's tenant may use (from its active industry packs).
      TENANT_URL: http://tenant-service:3000
    mem_limit: 384m
    security_opt: ["no-new-privileges:true"]

  ollama:
    # Optional local model runtime (CPU). Not started by the `ai` profile:
    #   docker compose --profile ai-model up -d ollama
    #   docker compose exec ollama ollama pull llama3.2:1b
    # then set OLLAMA_BASE_URL=http://ollama:11434 in .env and recreate ai-gateway-service.
    image: ollama/ollama:0.40.16
    restart: unless-stopped
    networks: [titan]
    profiles: [ai-model]
    volumes:
      - ollama-data:/root/.ollama
    mem_limit: 6g

  sensor-simulator:
    # Publishes synthetic readings for tenant "riverbend" so the live
    # dashboards have data. Waits until devices have been seeded.
    image: titan/telemetry-service:dev
    restart: unless-stopped
    networks: [titan]
    profiles: [iot]
    depends_on:
      mosquitto:
        condition: service_healthy
    working_dir: /repo
    command: ["node", "scripts/sensor-simulator.mjs", "--scenario", "${SIMULATOR_SCENARIO:-normal}", "--interval", "${SIMULATOR_INTERVAL_SECONDS:-3}"]
    environment:
      TITAN_KEYCLOAK_URL: http://keycloak:8080
      TITAN_GATEWAY_URL: http://gateway:3000
      TITAN_MQTT_URL: mqtt://mosquitto:1883
      MQTT_SIMULATOR_USER: ${MQTT_SIMULATOR_USER}
      MQTT_SIMULATOR_PASSWORD: ${MQTT_SIMULATOR_PASSWORD}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD}
    volumes:
      - ./scripts:/repo/scripts:ro
    healthcheck:
      disable: true
    mem_limit: 128m

  sensor-simulator-manufacturing:
    # Synthetic machine condition readings (vibration, bearing temperature,
    # spindle load) for tenant "meridian" (manufacturing pack).
    image: titan/telemetry-service:dev
    restart: unless-stopped
    networks: [titan]
    profiles: [iot]
    depends_on:
      mosquitto:
        condition: service_healthy
    working_dir: /repo
    command: ["node", "scripts/sensor-simulator.mjs", "--user", "maya.admin", "--scenario", "${MANUFACTURING_SIMULATOR_SCENARIO:-normal}", "--interval", "${SIMULATOR_INTERVAL_SECONDS:-3}"]
    environment:
      TITAN_KEYCLOAK_URL: http://keycloak:8080
      TITAN_GATEWAY_URL: http://gateway:3000
      TITAN_MQTT_URL: mqtt://mosquitto:1883
      MQTT_SIMULATOR_USER: ${MQTT_SIMULATOR_USER}
      MQTT_SIMULATOR_PASSWORD: ${MQTT_SIMULATOR_PASSWORD}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD}
    volumes:
      - ./scripts:/repo/scripts:ro
    healthcheck:
      disable: true
    mem_limit: 128m

  # ------------------------------------------------------------- observability
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    networks: [titan]
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    mem_limit: 512m

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    networks: [titan]
    profiles: [observability]
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    ports:
      - "127.0.0.1:${ALERTMANAGER_HOST_PORT:-9093}:9093"
    volumes:
      - ./infrastructure/monitoring/alertmanager:/etc/alertmanager:ro
    mem_limit: 128m
    security_opt: ["no-new-privileges:true"]

  loki:
    image: grafana/loki:3.5.0
    restart: unless-stopped
    networks: [titan]
    profiles: [observability]
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - loki-data:/loki
    mem_limit: 512m

  alloy:
    # Log shipper. Reads the Docker socket: acceptable on a developer machine only.
    image: grafana/alloy:v1.10.0
    restart: unless-stopped
    networks: [titan]
    profiles: [observability]
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./infrastructure/monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 256m

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    networks: [titan]
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3001}:3000"
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 384m

  # ------------------------------------------------------ disaster-recovery lab
  # A logically separate recovery environment on the SAME host. It demonstrates
  # the recovery procedure; it is not geographic DR and gives no high availability.
  postgres-dr:
    image: titan/postgres:dev
    restart: unless-stopped
    networks:
      titan:
      titan-dr:
    profiles: [dr-lab]
    depends_on:
      postgres:
        condition: service_started
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      DB_DEV_PASSWORD: ${DB_DEV_PASSWORD}
      PG_ROLE: standby
      PG_UPSTREAM_HOST: ${PG_DR_UPSTREAM:-postgres}
      PG_REPLICATION_PASSWORD: ${DB_DEV_PASSWORD}_replicator
      PG_NODE_NAME: recovery-site
    command: *postgres-command
    ports:
      - "127.0.0.1:${POSTGRES_DR_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-dr-data:/var/lib/postgresql/data
      - postgres-dr-wal-archive:/wal-archive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_SUPERUSER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s
    mem_limit: 1g

  # Isolated restore target for backup verification: reachable only on the DR
  # network, with throw-away storage (an anonymous volume, removed with the
  # container). Roles and empty databases come from the same init scripts as
  # production; data comes only from the backup.
  postgres-restore:
    image: titan/postgres:dev
    networks:
      titan-dr:
    profiles: [dr-lab]
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      DB_DEV_PASSWORD: ${DB_DEV_PASSWORD}
    command: ["postgres", "-c", "max_connections=100", "-c", "archive_mode=off"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_SUPERUSER} -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s
    mem_limit: 1g

  # Backup / restore tooling (pg_dump, pg_restore, psql) with access to both networks.
  dr-tools:
    image: titan/postgres:dev
    networks:
      titan:
      titan-dr:
    profiles: [dr-lab]
    entrypoint: ["sleep", "infinity"]
    environment:
      PGUSER: ${POSTGRES_SUPERUSER}
      PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
    volumes:
      - ./infrastructure/disaster-recovery/backups:/backups
    mem_limit: 512m

networks:
  titan:
    name: titan
  titan-dr:
    name: titan-dr

volumes:
  clamav-data:
  postgres-data:
  postgres-wal-archive:
  nats-data:
  mosquitto-data:
  lake:
  ollama-data:
  postgres-dr-data:
  prometheus-data:
  loki-data:
  grafana-data:
  postgres-dr-wal-archive:
