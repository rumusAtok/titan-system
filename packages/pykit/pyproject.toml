[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "titan-pykit"
version = "0.1.0"
description = "TITAN infrastructure helpers for Python services (auth, database, events, observability). No business logic."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.5",
  "uvicorn==0.54.0",
  "psycopg[binary]==3.3.8",
  "psycopg-pool==3.3.3",
  "pyjwt[crypto]==2.15.1",
  "httpx==0.28.1",
  "nats-py==2.16.0",
  "prometheus-client==0.26.0",
  "pydantic==2.14.3",
]

[tool.setuptools.packages.find]
include = ["titan_pykit*"]
