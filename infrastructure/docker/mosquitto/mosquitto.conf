# Eclipse Mosquitto - TITAN development broker.
# Plain MQTT on an internal network. Production uses TLS (8883) with
# per-device credentials or client certificates.
listener 1883 0.0.0.0

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Persist sessions and queued QoS 1 messages across broker restarts, so
# telemetry published while the ingestion service is down is not lost.
persistence true
persistence_location /mosquitto/data/
autosave_interval 30
max_queued_messages 100000

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
