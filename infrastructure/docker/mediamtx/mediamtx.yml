# Local video test server for the camera module (development only).
#
# Two paths publish a SYNTHETIC test pattern generated by ffmpeg inside this container: no camera,
# no recording, nothing from outside. Browsers play them as HLS on port 8888 (bound to 127.0.0.1).
# Real deployments point cameras at their own video management system instead.
logLevel: warn

rtsp: yes            # internal only (ffmpeg publishes to it); the port is not published
rtspAddress: :8554
rtmp: no
webrtc: no
srt: no
api: no
metrics: no
playback: no

hls: yes
hlsAddress: :8888
hlsAllowOrigin: '*'
hlsVariant: mpegts
hlsSegmentCount: 6
hlsSegmentDuration: 2s

paths:
  cam-a:
    runOnInit: >
      ffmpeg -hide_banner -loglevel error -re -f lavfi -i testsrc2=size=480x270:rate=10
      -c:v libx264 -preset ultrafast -tune zerolatency -g 20 -pix_fmt yuv420p -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnInitRestart: yes
  cam-b:
    runOnInit: >
      ffmpeg -hide_banner -loglevel error -re -f lavfi -i smptehdbars=size=480x270:rate=10
      -vf "drawbox=x='mod(t*60,440)':y=110:w=40:h=40:color=red@0.8:t=fill"
      -c:v libx264 -preset ultrafast -tune zerolatency -g 20 -pix_fmt yuv420p -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnInitRestart: yes
